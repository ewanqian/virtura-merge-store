<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d0d0c">
<title>时间 / 倒流 — VIRTURA MERGE</title>
<meta name="description" content="VIRTURA MERGE TIMER / REWIND 交互式 3D 数字物件。">
<link rel="stylesheet" href="timer.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
  }
}
</script>
</head>
<body>
<header class="topbar"><a href="index.html">VIRTURA / MERGE</a><span>OBJ-002 / DIGITAL OBJECT</span><a href="product.html?id=OBJ-002">详情 DETAILS</a></header>
<main>
  <section class="viewer" id="viewer">
    <div id="canvasMount" class="canvas-mount"></div>
    <div class="hud hud-left"><span>状态 STATE</span><b id="stateLabel">FORWARD</b></div>
    <div class="hud hud-right"><span>时间 TIME</span><b id="timeLabel">10:00</b></div>
    <div class="instructions">拖动旋转 · 滚轮缩放 · 将物件翻转至倒置方向进入 REWIND</div>
  </section>
  <section class="control-panel">
    <div><span class="eyebrow">OBJ-002 / TIMER / REWIND</span><h1><span class="cn-title">时间可以被翻转。</span><small>A physical interface for reversible time.</small></h1></div>
    <div class="controls">
      <button id="forwardBtn">正向 / FORWARD</button>
      <button id="holdBtn">保持 / HOLD</button>
      <button id="rewindBtn">倒流 / REWIND</button>
      <button id="resetBtn">复位 / RESET</button>
    </div>
    <p>当前原型中，物件朝向和显式控制都会改变时间方向。实体版本将把同一套状态模型映射到 IMU 姿态输入。</p>
  </section>
</main>
<script type="module" src="timer.js"></script>
</body>
</html>
